<header class="site-header">
  <h1 class="site-title">Video Grabber</h1>

  <div class="controls-wrapper">
    <!-- Кнопка для виклику панелі зміни фону -->
    <button class="control-button" (click)="isBgPanelVisible = !isBgPanelVisible">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round"
          d="m2.25 15.75 5.159-5.159a2.25 2.25 0 0 1 3.182 0l5.159 5.159m-1.5-1.5 1.409-1.409a2.25 2.25 0 0 1 3.182 0l2.909 2.909m-18 3.75h16.5a1.5 1.5 0 0 0 1.5-1.5V6a1.5 1.5 0 0 0-1.5-1.5H3.75A1.5 1.5 0 0 0 2.25 6v12a1.5 1.5 0 0 0 1.5 1.5Zm10.5-11.25h.008v.008h-.008V8.25Zm.375 0a.375.375 0 1 1-.75 0 .375.375 0 0 1 .75 0Z" />
      </svg>
    </button>

    <!-- Кнопка зміни теми (стара) -->
    <button class="control-button" (click)="toggleTheme()" aria-label="Toggle theme">
      <!-- Показуємо іконку Місяця, якщо тема світла -->
      @if (themeService.themeSignal() === 'light') {
      <svg class="theme-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
        stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round"
          d="M21.752 15.002A9.72 9.72 0 0 1 18 15.75c-5.385 0-9.75-4.365-9.75-9.75 0-1.33.266-2.597.748-3.752A9.753 9.753 0 0 0 3 11.25C3 16.635 7.365 21 12.75 21a9.753 9.753 0 0 0 9.002-5.998Z" />
      </svg>
      } @else {
      <!-- Інакше показуємо іконку Сонця -->
      <svg class="theme-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
        stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round"
          d="M12 3v2.25m6.364.386-1.591 1.591M21 12h-2.25m-.386 6.364-1.591-1.591M12 18.75V21m-4.773-4.227-1.591 1.591M5.25 12H3m4.227-4.773L5.636 5.636M15.75 12a3.75 3.75 0 1 1-7.5 0 3.75 3.75 0 0 1 7.5 0Z" />
      </svg>
      }
    </button>
  </div>

  <!-- Панель для введення URL, яка з'являється по кліку -->
  @if (isBgPanelVisible) {
    <div class="bg-panel">
      <!-- Невидимий input, який ми будемо викликати програмно -->
      <input type="file" #fileInput (change)="onFileSelected($event)" accept="image/*">
      <!-- Кнопка, яку бачить користувач -->
      <button class="panel-button" (click)="fileInput.click()">Вибрати файл</button>
      <button class="panel-button" (click)="resetBackground()">Скинути фон</button>
    </div>
  }
</header>
