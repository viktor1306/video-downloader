<div class="downloader-wrapper">
  <!-- Форма введення залишається без змін -->
  <div class="downloader-container">
    <input
      class="url-input"
      type="text"
      placeholder="Вставте посилання на відео..."
      [(ngModel)]="videoUrl"
    >
    <button class="download-button" (click)="onDownloadClick()">Завантажити</button>
  </div>

  <!-- Перемикач стану: або результати, або інструкція -->
  @if (downloadInfo) {
    <div class="results-container">
      <h3>Результат:</h3>
      <p>{{ downloadInfo.title }}</p>
    </div>
  } @else {
    <!-- НОВИЙ БЛОК: Інформаційна панель -->
    <div class="info-container">
      <h2>Як це працює?</h2>
      <ol class="steps-list">
        <li>Скопіюйте посилання на відео з однієї з платформ.</li>
        <li>Вставте посилання у поле вище.</li>
        <li>Натисніть кнопку "Завантажити"!</li>
      </ol>
      <div class="supported-platforms">
        <p>Підтримувані платформи:</p>
        <!-- Пізніше тут можна буде вставити справжні іконки -->
        <span>YouTube</span>
        <span>TikTok</span>
        <span>Instagram</span>
      </div>
    </div>
  }
</div>
